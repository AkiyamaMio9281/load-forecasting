name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      # The suite generates its own PJME-shaped series, so CI needs no Kaggle
      # credentials and no downloaded data. It runs the cleaning rules, the feature
      # contract, the leakage regression and a short backtest end to end -- not the
      # full 52-fold run, which belongs on a workstation.
      - name: Test
        run: pytest --cov=src --cov=app --cov-report=term-missing
