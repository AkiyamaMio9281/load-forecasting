[project]
name = "load-forecasting"
version = "0.1.0"
description = "Day-ahead hourly electricity load forecasting on PJM data with rolling-origin backtesting"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning:pandera.*",
    "ignore::DeprecationWarning:prophet.*",
    "ignore:.*future version incompatibility.*:UserWarning",
    "ignore::holidays.FutureIncompatibilityWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
